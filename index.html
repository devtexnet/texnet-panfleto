<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#001b6b">
<title>TEXNET - Internet de Verdade | Mandara by Yoo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html,
  body {
    width: 100%;
    min-height: 100%;
  }

  body {
    font-family: 'Outfit', Arial, sans-serif;
    min-height: 100vh;
    background: #001b6b;
    padding: 14px 12px 110px;
    overflow-x: hidden;
  }

  .wrap {
    width: 100%;
    max-width: 980px;
    margin: 0 auto;
  }

  .panels {
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
    width: 100%;
  }

  @media (min-width: 820px) {
    .panels {
      grid-template-columns: 1fr 1fr;
      align-items: start;
    }
  }

  .card {
    position: relative;
    width: 100%;
    border-radius: 18px;
    overflow: hidden;
    background: #001b6b;
    box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }

  .card img {
    display: block;
    width: 100%;
    height: auto;
    max-width: 100%;
    border: 0;
  }

  .cta {
    position: absolute;
    left: 11.33%;
    top: 82.32%;
    width: 77.74%;
    height: 7.88%;
    display: block;
    border-radius: 14px;
    z-index: 2;
  }

  .float-wa {
    position: fixed;
    z-index: 20;
    right: max(16px, env(safe-area-inset-right));
    bottom: max(16px, env(safe-area-inset-bottom));
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    background: #25D366;
    color: #04210f;
    text-decoration: none;
    font-weight: 800;
    font-size: 15px;
    padding: 13px 18px;
    border-radius: 999px;
    box-shadow:
      0 10px 28px rgba(0,0,0,.45),
      0 0 0 4px rgba(37,211,102,.18);
  }

  .float-wa svg {
    width: 22px;
    height: 22px;
    flex: 0 0 auto;
  }

  @media (max-width: 380px) {
    .float-wa .lbl {
      display: none;
    }

    .float-wa {
      padding: 14px;
    }
  }

  footer {
    color: rgba(255,255,255,.65);
    font-size: 12px;
    font-weight: 500;
    text-align: center;
    margin-top: 22px;
    line-height: 1.35;
  }
</style>
</head>

<body>
