<style>
  :root {
    --azul-fundo: #001b6b;
    --azul-fundo-2: #000a33;
    --ciano: #16b6ff;
    --ciano-glow: rgba(22,182,255,.55);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body { width:100%; }
  body {
    font-family:'Outfit', system-ui, sans-serif;
    min-height:100dvh;
    background:
      radial-gradient(circle at 20% 0%, #0a3aa8 0%, transparent 55%),
      radial-gradient(circle at 85% 100%, #0a3aa8 0%, transparent 55%),
      linear-gradient(160deg, var(--azul-fundo) 0%, var(--azul-fundo-2) 100%);
    background-attachment: fixed;
    display:flex; flex-direction:column; align-items:center;
    padding: clamp(14px, 4vw, 40px) clamp(12px,3.5vw,32px) 32px;
    overflow-x:hidden;
  }
  /* arcos de sinal decorativos */
  body::before, body::after {
    content:""; position:fixed; width:60vmax; height:60vmax; border-radius:50%;
    border:2px solid rgba(22,182,255,.06); pointer-events:none; z-index:0;
  }
  body::before { top:-30vmax; left:-25vmax; box-shadow:0 0 0 14vmax rgba(22,182,255,.025); }
  body::after  { bottom:-30vmax; right:-25vmax; }

  .wrap { position:relative; z-index:1; width:100%; max-width:980px; display:flex; flex-direction:column; align-items:center; }

  .panels {
    display:flex; flex-direction:column; gap:clamp(14px,3.5vw,22px);
    width:100%; align-items:stretch;
  }
  @media (min-width: 820px) {
    .panels { flex-direction:row; align-items:flex-start; }
  }

  .panel { position:relative; flex:1 1 0; min-width:0;
    border-radius:18px; overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.04);
    animation: rise .7s cubic-bezier(.2,.8,.2,1) both;
  }
  .panel:nth-child(2) { animation-delay:.12s; }
  .panel img { display:block; width:100%; height:auto; }

  /* área clicável do botão de WhatsApp */
  .cta {
    position:absolute;
    left:11.33%; top:82.32%; width:77.74%; height:7.88%;
    border-radius:14px;
    display:block; z-index:3;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow:0 0 0 0 var(--ciano-glow); }
    50%     { box-shadow:0 0 0 10px rgba(22,182,255,0); }
  }
  @keyframes rise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }

  /* botão fixo de WhatsApp como reforço de conversão */
  .float-wa {
    position:fixed; z-index:9; right:max(16px, env(safe-area-inset-right));
    bottom:max(16px, env(safe-area-inset-bottom));
    display:inline-flex; align-items:center; gap:9px;
    background:#25D366; color:#04210f; text-decoration:none;
    font-weight:800; font-size:15px; padding:13px 18px; border-radius:999px;
    box-shadow:0 10px 28px rgba(0,0,0,.45), 0 0 0 4px rgba(37,211,102,.18);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .float-wa:hover { transform:translateY(-2px); }
  .float-wa svg { width:22px; height:22px; }
  .float-wa .lbl { white-space:nowrap; }
  @media (max-width:380px) { .float-wa .lbl { display:none; } .float-wa { padding:14px; } }

  footer { z-index:1; color:rgba(255,255,255,.55); font-size:12px; font-weight:500;
    text-align:center; margin-top:22px; letter-spacing:.3px; }
</style>
