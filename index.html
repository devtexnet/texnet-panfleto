  .panel{

    border-radius:18px; overflow:hidden;

    animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
  }
  .panel:nth-child(2){ animation-delay:.12s; }
  .panel img{ display:block; width:100%; height:auto; }
  .cta{

    animation:pulse 1.8s ease-in-out infinite;

  @keyframes pulse{

  }
  @keyframes rise{ from{ opacity:0; transform:translateY(18px); } to{ opacity:1; transform:none; } }
  .float-wa{
    position:fixed; z-index:9; right:max(16px,env(safe-area-inset-right));

    box-shadow:0 10px 28px rgba(0,0,0,.45),0 0 0 4px rgba(37,211,102,.18);

  @media(max-width:380px){ .float-wa .lbl{ display:none; } .float-wa{ padding:14px; } }
