<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#001b6b">
<title>TEXNET - Mandara by Yoo</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    background: #001b6b;
    overflow: hidden;
  }

  body {
    font-family: Arial, sans-serif;
  }

  .screen {
    position: fixed;
    inset: 0;
    background: #001b6b;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 92px;
  }

  .slide {
    position: absolute;
    inset: 0 0 92px 0;
    width: 100%;
    height: calc(100% - 92px);
    object-fit: contain;
    object-position: center center;
    opacity: 0;
    transition: opacity .45s ease;
    background: #001b6b;
  }

  .slide.active {
    opacity: 1;
  }

  .float-wa {
    position: fixed;
    z-index: 20;
    left: 50%;
    bottom: max(16px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 390px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #25D366;
    color: #04210f;
    text-decoration: none;
    font-weight: 800;
    font-size: 16px;
    padding: 15px 18px;
    border-radius: 999px;
    box-shadow:
      0 10px 28px rgba(0,0,0,.45),
      0 0 0 4px rgba(37,211,102,.18);
  }

  .float-wa svg {
    width: 23px;
    height: 23px;
    flex: 0 0 auto;
  }
</style>
</head>

<body>

<main class="screen">
  <img
    class="slide active"
    src="./panel_left.jpg?v=1"
    alt="TEXNET - Planos de internet para moradores do Mandara by Yoo"
  >

  <img
    class="slide"
    src="./panel_right.jpg?v=1"
    alt="TEXNET - Complete seu combo com streaming e canais"
  >
</main>

<a
  class="float-wa"
  href="https://wa.me/558521809191?text=Quero%20aproveitar%20as%20ofertas%20exclusivas%20do%20Mandara%20by%20Yoo%20e%20saber%20mais%20sobre%20as%20condi%C3%A7%C3%B5es%20dispon%C3%ADveis."
  target="_blank"
  rel="noopener"
  aria-label="Falar no WhatsApp"
>
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.587-5.946C.16 5.335 5.495 0 12.05 0a11.82 11.82 0 018.413 3.488 11.82 0 013.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884a9.86 9.86 0 001.518 5.26l-.999 3.648 3.745-.982zm5.387-4.764c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
  </svg>

  <span>Falar no WhatsApp</span>
</a>

<script>
  const slides = document.querySelectorAll('.slide');
  let current = 0;

  setInterval(() => {
    slides[current].classList.remove('active');
    current = (current + 1) % slides.length;
    slides[current].classList.add('active');
  }, 2000);
</script>

</body>
</html>
